<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d71920;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ab1117;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Red circle background with cut-out effect (mimicking border-l-transparent border-r-transparent) -->
  <circle cx="50" cy="50" r="48" fill="url(#grad)" stroke="#d71920" stroke-width="2"/>
  
  <!-- Simulated transparent left/right edges by overlaying white/transparent arcs -->
  <!-- Actually simpler: just a clean red circle with white "E" -->
  <text x="50" y="72" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="white" text-anchor="middle">E</text>
</svg>